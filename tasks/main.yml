---
# tasks file for ntp
- name: include OS specific variables
  tags: ntp
  ansible.builtin.include_vars: 
    file: "vars/{{ ansible_os_family }}.yml"

- name: ensure package is installed if dealing with RHEL
  when: ansible_os_family == "RedHat"
  tags: ntp
  ansible.builtin.package:
    name: ntp_pkg
    state: present

- name: call task to ensure service is started
  tags: ntp
  ansible.builtin.include_tasks: "{{ ansible_os_family }}_enable_start_svc.yml"
   
- name: ensure config is setup to comment out default pool entries if specified
  when: ntp_enable_servers_over_pool == true
  tags: ntp
  loop:
    "{{ ntp_pool_entries }}"
  ansible.builtin.lineinfile:
    path: "{{ ntp_config_filepath }}"
    regex: "{{ item }}"
    line: "#{{ item }}"

- name: ensure config is setup to enable  default pool entries if specified
  when: ntp_enable_servers_over_pool == false
  tags: ntp
  loop:
    "{{ ntp_pool_entries }}"
  ansible.builtin.lineinfile:
    path: "{{ ntp_config_filepath }}"
    line: "{{ item }}"
    state: present

- name: ensure config is setup to add servers if specified
  when: ntp_enable_servers_over_pool == true
  tags: ntp
  notify: "restart ntp {{ ansible_os_family }}"
  loop:
    "{{ ntp_servers }}"
  ansible.builtin.lineinfile:
    path: "{{ ntp_config_filepath }}"
    line: "{{ item }}"

- name: ensure config is setup use pool servers, disable custom server if specified
  when: ntp_enable_servers_over_pool == false
  tags: ntp
  notify: "restart ntp {{ ansible_os_family }}"
  loop:
    "{{ ntp_servers }}"
  ansible.builtin.lineinfile:
    regex: "{{ item }}"
    path: "{{ ntp_config_filepath }}"
    line: "#{{ item }}"

