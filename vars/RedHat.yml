---
# used to comment lines out in the config if user chost
# to use a server instead of a pool
ntp_pool_entries:
  - pool 1.rhel.pool.ntp.org iburst
  - pool 2.rhel.pool.ntp.org iburst
  - pool 3.rhel.pool.ntp.org iburst

# will only be used on FreeBSD systems.  Creating to avoid inconsistency errors
ntp_rc_ntp_enable_line: 
ntp_jail_prepath: 
ntp_rc_ntp_enable_line:

# end of FreeBSD variables

ntp_config_filepath: /etc/ntp.conf

# service name
ntp_svc: ntpd

# package name
ntp_pkg: ntp
