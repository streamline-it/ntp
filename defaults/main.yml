---
# defaults file for ntp
#list server(s) to pull time from and settings
# example:
# ntp_servers:
#   - server.example.com -iburst
#
ntp_servers:
  -

# if this is true default pool entries are commented out
# if this is false default pool entries are left alone
ntp_enable_servers_over_pool: false

ntp_jail_it: false

ntp_jail_name: 

# The following are FreeBSD Jail specific, don't change 
# values if working with a RHEL host or if on
# a FreeBSD system and you're not using jails

# The jail prepath for the jail host.
# Ex if the jail is under /jails/jail_host
# Make sure to add the tailing backslash.  The ntp_config_filepath
# is going to be used to follow this variable
# ntp_jail_prepath: /jails/jail_host/ 

ntp_jail_prepath:

# setup restrictions for ntp
ntp_restict_lines:
  -
